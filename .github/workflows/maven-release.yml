name: Release to Maven Central

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '17'
        distribution: 'temurin'
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
        server-id: central
        server-username: ${{ vars.CENTRAL_TOKEN_USERNAME }}
        server-password: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}

    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git config credential.helper 'store --file ~/.git-credentials'
        echo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com" > ~/.git-credentials

    - name: Setup JDK 17 and Maven 3.9.15
      uses: s4u/setup-maven-action@5d4481650d2563723ad6c5e8f009ac8fd746e3e8 # v1.22.0
      with:
        java-version: '17'
        java-distribution: 'temurin'
        maven-version: '3.9.15'

    - name: Create Maven Settings
      uses: s4u/maven-settings-action@4cfd36368400327fd45dcb28f190ae7b85533deb # commit hash references to v4.1.0
      with:
        servers: |
          [{
            "id": "central",
            "username": "${{ vars.CENTRAL_TOKEN_USERNAME }}",
            "password": "${{ secrets.CENTRAL_TOKEN_PASSWORD }}"
          }]
        gpg: true

    - name: Run Maven Release
      run: mvn -Prelease-sign-artifacts -DskipTests -Darguments=-DskipTests -DtagNameFormat="v@{project.version}" release:prepare release:perform -B
      env:
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
